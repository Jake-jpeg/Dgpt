name: State Law Monitor

# WHY THIS FILE EXISTS:
# The /api/monitor endpoint checks NY/NJ court rules against the registry
# and emails admin@divorcegpt.com on any detected change. It was built to be
# "callable via cron" but no cron existed — so it never ran on its own.
# This workflow is that cron.
#
# SETUP (one time):
#   1. In GitHub: Settings -> Secrets and variables -> Actions -> New repository secret
#        Name:  MONITOR_SECRET   Value: <same value as the MONITOR_SECRET env var on DigitalOcean>
#   2. (optional) override the URL with a repo VARIABLE named MONITOR_URL
#        default is https://divorcegpt.com/api/monitor
#
# Manual run: Actions tab -> State Law Monitor -> Run workflow.

on:
  schedule:
    # 14:00 UTC on the 1st of every month (~9-10am ET). Court sites post
    # revisions around the 1st, so this catches them early.
    - cron: '0 14 1 * *'
  workflow_dispatch: {}   # lets you trigger it by hand from the Actions tab

jobs:
  check-state-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger monitor endpoint
        env:
          MONITOR_SECRET: ${{ secrets.MONITOR_SECRET }}
          MONITOR_URL: ${{ vars.MONITOR_URL || 'https://divorcegpt.com/api/monitor' }}
        run: |
          if [ -z "$MONITOR_SECRET" ]; then
            echo "::error::MONITOR_SECRET repo secret is not set. Add it in Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          echo "Calling $MONITOR_URL ..."
          HTTP_CODE=$(curl -sS -o response.json -w "%{http_code}" \
            -X POST "$MONITOR_URL" \
            -H "Content-Type: application/json" \
            --max-time 180 \
            -d "{\"secret\":\"$MONITOR_SECRET\"}")

          echo "HTTP $HTTP_CODE"
          echo "----- response -----"
          cat response.json || true
          echo ""
          echo "--------------------"

          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "::error::Monitor returned HTTP $HTTP_CODE"
            exit 1
          fi

          # Surface a flag in the Actions log if any state needs attention.
          if grep -q '"changesDetected":[1-9]' response.json || grep -q '"reviewRecommended":[1-9]' response.json || grep -q '"errors":[1-9]' response.json; then
            echo "::warning::Monitor flagged at least one state — check admin@divorcegpt.com for the alert email."
          else
            echo "All registered states confirmed current."
          fi
